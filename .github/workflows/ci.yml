name: CI

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Build, lint and formatting
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Ubuntu's Rust toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates cargo rust-clippy rustfmt
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Verify formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked

  release:
    needs: quality
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: write
      packages: write
